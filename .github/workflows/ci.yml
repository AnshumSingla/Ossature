# Runs on every push and pull request.
name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: new advisories can appear without any code change

permissions:
  contents: read

jobs:
  backend-and-agent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ossature
          POSTGRES_USER: ossature
          POSTGRES_PASSWORD: ossature
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ossature -d ossature" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: agent/requirements-dev.txt }
      # Backend first: its tests include the row-level-security and multi-instance tests against the real
      # database above, and they run the migrations that create the agent's table and roles.
      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test
      - name: Agent tests (real Postgres, restricted role)
        working-directory: agent
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Install what the audit reads
        run: |
          (cd frontend && npm ci)
          python -m venv agent/.venv
          agent/.venv/bin/python -m pip install -r agent/requirements-dev.txt
      # Fails on any HIGH/CRITICAL/unrated finding not listed (with a reason and an expiry date) in
      # scripts/audit-allowlist.json.
      - run: python scripts/audit_dependencies.py

  static-analysis:
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Reviewed false positives carry an inline `nosemgrep` comment with the reason; --error fails on any other finding.
      - run: >-
          semgrep scan --metrics=off --error
          --config p/default --config p/java --config p/python --config p/typescript --config p/react
          --config p/owasp-top-ten --config p/jwt --config p/secrets
          --exclude node_modules --exclude target --exclude .venv --exclude dist
          backend/src/main agent/app frontend/src scripts

  secret-scan:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }   # the action comments findings on the PR
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # the whole history, not just the tip
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required by the action to scan pull requests
          GITLEAKS_CONFIG: .gitleaks.toml

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: |
          (cd frontend && npm ci)
          python -m venv agent/.venv
          agent/.venv/bin/python -m pip install -r agent/requirements.txt
          python -m pip install cyclonedx-bom
          python scripts/generate_sbom.py
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom/ }
