# H20: automatic update PRs. Security updates arrive as soon as an advisory is published; version
# updates are grouped weekly so they do not drown the review queue.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      backend-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      agent-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
