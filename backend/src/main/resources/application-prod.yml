# Activated with SPRING_PROFILES_ACTIVE=prod. Secrets are NOT set here - they must come from the
# environment (JWT_SECRET, POSTGRES_PASSWORD, AGENT_SHARED_SECRET, OWNER_EMAILS, CORS origins);
# ProductionSafetyCheck refuses to start if the development defaults are still in use.
ossature:
  cors:
    # Override with your real frontend origin(s): OSSATURE_CORS_ALLOWED_ORIGINS_0=https://app.example.com
    allowed-origins: []
logging:
  level:
    root: INFO
    # DEBUG logs would carry transcripts and emails into log storage.
    com.ossature.interviewer: INFO
management:
  endpoint:
    health:
      show-details: never
