# Local infra only. Application services run on the host during development.
services:
  postgres:
    image: postgres:18.4-alpine   # pinned (H20); bump deliberately, Dependabot watches this file
    container_name: ossature-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ossature}
      POSTGRES_USER: ${POSTGRES_USER:-ossature}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ossature}
    # Bound to loopback only: the services run on the host in development, so nothing else
    # needs this port, and publishing it on 0.0.0.0 would expose a database whose default
    # password is public. (Do not use this file for production - see docs/remaining-work-and-security-plan.md.)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ossature} -d ${POSTGRES_DB:-ossature}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.18.0   # dev tool only (profile "tools"); pinned instead of :latest
    container_name: ossature-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-dev@ossature.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres

volumes:
  pgdata:
